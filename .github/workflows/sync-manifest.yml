name: Synchronize Technical Manifest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[doc-sync]')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run test suite before synchronization
        run: pytest -q

      - name: Synchronize technical manifest via the existing CLI
        run: doc-sync . --manifest-path docs/technical-app-manifest.md

      - name: Check for a real manifest diff
        id: manifest_diff
        run: |
          if git diff --quiet -- docs/technical-app-manifest.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push manifest change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.manifest_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/technical-app-manifest.md
          git diff --cached --quiet -- docs/technical-app-manifest.md || git commit -m "chore: sync technical manifest [doc-sync]"
          git push origin HEAD:main